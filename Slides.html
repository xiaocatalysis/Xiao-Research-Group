<!-- === BEGIN HEADER === -->
<!DOCTYPE html>
<body>
            <div id="slideshow" class="bottom-border-shadow">
                <div class="container no-padding background-white bottom-border">
                    <div class="row">
                        <!-- Carousel Slideshow -->
                        <div id="carousel-example" class="carousel slide" data-ride="carousel">
                            <!-- Carousel Indicators -->
                            <ol class="carousel-indicators">
                                <li data-target="#carousel-example" data-slide-to="0" class="active"></li>
                                <li data-target="#carousel-example" data-slide-to="1"></li>
                                <li data-target="#carousel-example" data-slide-to="2"></li>
                            </ol>
                            <div class="clearfix"></div>
                            <!-- End Carousel Indicators -->
                            <!-- Carousel Images -->
                            <div class="carousel-inner">
			        <div class="item active">
                                    <img src="assets/img/slideshow/slide06.png">
                                </div>
                                <div class="item">
                                    <img src="assets/img/slideshow/slide01.png">
                                </div>
                                <div class="item">
                                    <img src="assets/img/slideshow/slide_runaway.png">
                                </div>
                                <div class="item">
                                    <img src="assets/img/slideshow/slide02.png">
                                </div>
                                <div class="item">
                                    <img src="assets/img/slideshow/slide04.png">
                                </div>
                                <div class="item">
                                    <img src="assets/img/slideshow/slide05.png">
                                </div>
                            </div>
                            <!-- End Carousel Images -->
                            <!-- Carousel Controls -->
                            <a class="left carousel-control" href="#carousel-example" data-slide="prev">
                                <span class="glyphicon glyphicon-chevron-left"></span>
                            </a>
                            <a class="right carousel-control" href="#carousel-example" data-slide="next">
                                <span class="glyphicon glyphicon-chevron-right"></span>
                            </a>
                            <!-- End Carousel Controls -->
                        </div>
                        <!-- End Carousel Slideshow -->
                    </div>
                </div>
            </div>
</body>
</html>
