<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Visitor map</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            min-height: 0;
            overflow: hidden;
            background: transparent;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #map-widget {
            width: 100%;
            min-height: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        canvas,
        iframe,
        svg,
        img {
            max-width: 100% !important;
            height: auto;
        }
    </style>
</head>
<body>
    <div id="map-widget">
        <!-- MapMyVisitors visitor map (replaces the discontinued ClustrMaps
             globe). Widget created Aug 2026 for https://www2.latech.edu/~yxiao/
             This script must appear only once and keep its id. -->
        <script type="text/javascript" id="mapmyvisitors" src="https://mapmyvisitors.com/map.js?d=8FPNe76p3fde1UyJlROxdTjZaIDXwYM_tKbTmv9hr5o&cl=ffffff&w=a"></script>
    </div>
</body>
</html>
