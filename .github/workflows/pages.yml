# Build the RECSL site from the PHP/HTML sources and deploy ONLY the rendered
# output to GitHub Pages. Requires: Settings -> Pages -> Source = "GitHub Actions".
name: Build and deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build static site
        run: python3 tools/build.py --out build
      - name: Validate built site (fails the deploy on broken links)
        run: python3 tools/check_site.py build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
